<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agro-Zia | Inquiry QA Preview</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f8fbf9;color:#17362a}
    main{max-width:980px;margin:auto;padding:48px 20px}
    .hero{background:linear-gradient(135deg,#103d2a,#237b52);color:white;padding:42px;border-radius:18px}
    .hero h1{font-size:clamp(34px,6vw,58px);line-height:1.08}
    .panel{background:white;border:1px solid #dce8e0;border-radius:18px;padding:26px;margin-top:24px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    label{font-size:13px;font-weight:800}
    input,textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #cbdacf;border-radius:8px;font:inherit}
    textarea{min-height:130px}.full{grid-column:1/-1}.actions{margin-top:20px}
    .btn{padding:12px 18px;border:0;border-radius:9px;background:#145b3b;color:white;font-weight:800;cursor:pointer}
    .btn:disabled{opacity:.65;cursor:wait}.note{font-size:12px;color:#60766b}
    .result{margin-top:18px;padding:16px;border-radius:10px;background:#edf5ef;display:none;white-space:pre-wrap}
    .result.show{display:block}.error{background:#fff1f0}
    @media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p>B2B BUSINESS INQUIRY · QA PREVIEW</p>
      <h1>Tell Agro-Zia what you need.</h1>
      <p>Standalone QA page for server-side validation, D1 persistence, R2 attachment storage and notification delivery.</p>
    </section>
    <section class="panel">
      <form id="f" enctype="multipart/form-data">
        <div class="grid">
          <label>Product / category<input name="product" required></label>
          <label>Company<input name="company"></label>
          <label>Required specification<input name="specification"></label>
          <label>Quantity<input name="quantity"></label>
          <label>Destination<input name="destination"></label>
          <label>Preferred timing<input name="timing"></label>
          <label>Email<input name="email" type="email"></label>
          <label>Phone / WhatsApp<input name="phone"></label>
          <label class="full">Contact name<input name="company_contact_name"></label>
          <label class="full">Additional requirements<textarea name="message"></textarea></label>
          <label class="full">Attachment (optional)<input id="attachment" name="attachment" type="file" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,image/jpeg,image/png,image/webp,.pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.webp"><small class="note">PDF, DOC, DOCX, TXT, JPG/JPEG, PNG or WEBP · maximum 1 MB.</small></label>
        </div>
        <div class="actions"><button class="btn" type="submit">Submit Business Inquiry</button></div>
        <p class="note">Email or Phone / WhatsApp is required. The server must persist the inquiry in D1 before returning a reference.</p>
        <div id="r" class="result" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script>
    (() => {
      const MAX_BYTES = 1024 * 1024;
      const TYPES = new Set(['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','text/plain','image/jpeg','image/jpg','image/png','image/webp']);
      const EXTENSIONS = /\.(pdf|doc|docx|txt|jpe?g|png|webp)$/i;
      const form = document.getElementById('f');
      const input = document.getElementById('attachment');
      const button = form.querySelector('button');
      const result = document.getElementById('r');

      const show = (text, error = false) => {
        result.className = error ? 'result show error' : 'result show';
        result.textContent = text;
      };

      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file) return;
        if ((!TYPES.has(file.type) && file.type) || !EXTENSIONS.test(file.name || '')) {
          input.value = '';
          show('Please attach a PDF, DOC, DOCX, TXT, JPG/JPEG, PNG or WEBP file.', true);
          return;
        }
        if (file.size > MAX_BYTES) {
          input.value = '';
          show('Attachment must be 1 MB or smaller.', true);
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (button.disabled) return;
        const attachment = input.files && input.files[0];
        if (attachment && (attachment.size > MAX_BYTES || (!TYPES.has(attachment.type) && attachment.type) || !EXTENSIONS.test(attachment.name || ''))) {
          show('Please select a valid attachment (PDF, DOC, DOCX, TXT, JPG/JPEG, PNG or WEBP) up to 1 MB.', true);
          return;
        }

        button.disabled = true;
        button.textContent = 'Submitting inquiry…';
        result.className = 'result';
        result.textContent = '';
        try {
          const body = new FormData(form);
          body.set('language', 'en');
          const response = await fetch('/api/inquiries', { method:'POST', body, credentials:'same-origin' });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.ok !== true || payload.persisted !== true || !payload.request_number) {
            throw new Error(payload.error || `HTTP ${response.status}`);
          }
          const lines = [
            'Inquiry submitted successfully',
            `Request Reference: ${payload.request_number}`,
            `Persisted: ${payload.persisted}`,
            `Status: ${payload.status || 'received'}`,
            payload.attachment?.name ? `Attachment: ${payload.attachment.name}` : 'Attachment: none',
            `Email notification: ${payload.email_notification || 'unknown'}`,
            `Telegram notification: ${payload.telegram_notification || 'unknown'}`
          ];
          show(lines.join('\n'));
          form.reset();
        } catch (error) {
          show(`Unable to submit: ${error && error.message ? error.message : 'unknown_error'}`, true);
        } finally {
          button.disabled = false;
          button.textContent = 'Submit Business Inquiry';
        }
      });
    })();
  </script>
</body>
</html>
