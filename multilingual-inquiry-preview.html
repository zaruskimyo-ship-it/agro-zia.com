<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agro-Zia | Inquiry QA Preview</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f8fbf9;color:#17362a}main{max-width:980px;margin:auto;padding:48px 20px}.hero{background:linear-gradient(135deg,#103d2a,#237b52);color:white;padding:42px;border-radius:18px}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.08}.panel{background:white;border:1px solid #dce8e0;border-radius:18px;padding:26px;margin-top:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:800}input,select,textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #cbdacf;border-radius:8px;font:inherit}textarea{min-height:130px}.full{grid-column:1/-1}.actions{margin-top:20px}.btn{padding:12px 18px;border:0;border-radius:9px;background:#145b3b;color:white;font-weight:800;cursor:pointer}.note{font-size:12px;color:#60766b}.result{margin-top:18px;padding:16px;border-radius:10px;background:#edf5ef;display:none}.result.show{display:block}.error{background:#fff1f0}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><main><section class="hero"><p>B2B BUSINESS INQUIRY · QA PREVIEW</p><h1>Tell Agro-Zia what you need.</h1><p>Server-side inquiry validation, D1 persistence and request-reference generation.</p></section><section class="panel"><form id="f"><div class="grid"><label>Product / category<input name="product" required></label><label>Company<input name="company"></label><label>Required specification<input name="specification"></label><label>Quantity<input name="quantity"></label><label>Destination<input name="destination"></label><label>Preferred timing<input name="timing"></label><label>Email<input name="email" type="email"></label><label>Phone / WhatsApp<input name="phone"></label><label class="full">Additional requirements<textarea name="message"></textarea></label></div><div class="actions"><button class="btn">Submit Business Inquiry</button></div><p class="note">Email or Phone / WhatsApp is required. The server must persist the inquiry in D1 before returning a reference.</p><div id="r" class="result" aria-live="polite"></div></form></section></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),r=document.getElementById('r');b.disabled=true;const d=Object.fromEntries(new FormData(f));d.language='en';try{const x=await fetch('/api/inquiries',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)}),j=await x.json();if(!x.ok)throw new Error(j.error||'request_failed');r.className='result show';r.innerHTML='<strong>Inquiry submitted successfully</strong><br>Request Reference: <strong>'+j.request_number+'</strong><br>Persisted: '+j.persisted+'<br>Status: '+j.status}else{r.className='result show error';r.textContent='Unable to submit: '+(j.error||'request_failed')}}catch(err){r.className='result show error';r.textContent='Unable to submit: '+err.message}finally{b.disabled=false}})</script></body></html>
