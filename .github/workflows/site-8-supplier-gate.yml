name: SITE-8 Supplier Operations Gate

on:
  push:
    branches: [feat/site-8-supplier-operations, feat/recovery-i18n-country-clock, feat/unified-quote-thread]
  pull_request:
    branches: [main]
    paths:
      - 'zarus-supplier-workspace.html'
      - 'assets/zarus-supplier-operations.js'
      - 'src/supplier/**'
      - 'src/customer/transaction-api.js'
      - '_worker.js'
      - 'migrations/0011_supplier_accounts.sql'
      - 'migrations/0012_supplier_quote_messages.sql'
      - 'docs/SITE-8-SUPPLIER-OPERATIONS.md'
      - '.github/workflows/site-8-supplier-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check assets/zarus-supplier-operations.js
          node --check src/supplier/supplier-auth.js
          node --check src/supplier/supplier-ownership.js
          node --check src/supplier/supplier-api.js
          node --check src/supplier/supplier-workspace-api.js
          node --check src/supplier/supplier-quote-api.js
          node --check src/supplier/supplier-messaging-api.js
          node --check src/customer/transaction-api.js
          node --check _worker.js
      - name: Contract assertions
        run: |
          grep -q 'draft -> sent -> negotiating' docs/SITE-8-SUPPLIER-OPERATIONS.md
          grep -q 'supplier/workspace' assets/zarus-supplier-operations.js
          grep -q 'RFQ' zarus-supplier-workspace.html
          grep -Fq 'handleSupplierMessagingRoute' _worker.js
          grep -Fq 'url.pathname.startsWith("/api/supplier/quotes")' _worker.js
          grep -Fq 'requireSupplier' src/supplier/supplier-quote-api.js
          grep -Fq 'supplier_id: supplier.supplier_id' src/supplier/supplier-quote-api.js
          grep -Fq 'WHERE id = ? AND supplier_id = ?' src/supplier/supplier-quote-api.js
          grep -Fq 'send: { from:' src/supplier/supplier-quote-api.js
          grep -Fq 'negotiate: { from:' src/supplier/supplier-quote-api.js
          grep -Fq 'withdraw: { from:' src/supplier/supplier-quote-api.js
          grep -Fq 'action === "expire"' src/supplier/supplier-quote-api.js
          grep -Fq "status='expired'" src/supplier/supplier-quote-api.js
          grep -Fq 'WHERE r.supplier_id = ?' src/supplier/supplier-workspace-api.js
          grep -Fq 'WHERE supplier_id = ?' src/supplier/supplier-workspace-api.js
          grep -q 'commerce_supplier_quote_messages' migrations/0012_supplier_quote_messages.sql
          grep -q 'supplier_account_id' migrations/0012_supplier_quote_messages.sql
          grep -Fq 'MAX_MESSAGE_LENGTH = 4000' src/supplier/supplier-messaging-api.js
          grep -Fq 'sender_type: "supplier"' src/supplier/supplier-messaging-api.js
          grep -Fq 'commerce_quote_messages' src/supplier/supplier-messaging-api.js
          grep -Fq 'commerce_supplier_quote_messages' src/customer/transaction-api.js
          grep -Fq 'sender_type' src/customer/transaction-api.js
          grep -Fq 'message_required' src/customer/transaction-api.js
          grep -Fq 'customer_account_id' src/customer/transaction-api.js
