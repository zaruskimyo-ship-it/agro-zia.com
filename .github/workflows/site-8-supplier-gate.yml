name: SITE-8 Supplier Operations Gate

on:
  push:
    branches: [feat/site-8-supplier-operations, feat/recovery-i18n-country-clock, feat/unified-quote-thread]
  pull_request:
    branches: [main]
    paths:
      - 'zarus-supplier-workspace.html'
      - 'assets/zarus-supplier-operations.js'
      - 'src/supplier/**'
      - 'src/customer/transaction-api.js'
      - '_worker.js'
      - 'migrations/0011_supplier_accounts.sql'
      - 'migrations/0012_supplier_quote_messages.sql'
      - 'docs/SITE-8-SUPPLIER-OPERATIONS.md'
      - '.github/workflows/site-8-supplier-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check assets/zarus-supplier-operations.js
          node --check src/supplier/supplier-auth.js
          node --check src/supplier/supplier-ownership.js
          node --check src/supplier/supplier-api.js
          node --check src/supplier/supplier-workspace-api.js
          node --check src/supplier/supplier-quote-api.js
          node --check src/supplier/supplier-messaging-api.js
          node --check src/customer/transaction-api.js
          node --check _worker.js
      - name: Contract assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checks = [
              ('docs/SITE-8-SUPPLIER-OPERATIONS.md', 'draft -> sent -> negotiating'),
              ('assets/zarus-supplier-operations.js', 'supplier/workspace'),
              ('zarus-supplier-workspace.html', 'RFQ'),
              ('_worker.js', 'handleSupplierMessagingRoute'),
              ('_worker.js', 'url.pathname.startsWith("/api/supplier/quotes")'),
              ('src/supplier/supplier-quote-api.js', 'requireSupplier'),
              ('src/supplier/supplier-quote-api.js', 'supplier_id: supplier.supplier_id'),
              ('src/supplier/supplier-quote-api.js', 'WHERE id = ? AND supplier_id = ?'),
              ('src/supplier/supplier-quote-api.js', 'send: { from:'),
              ('src/supplier/supplier-quote-api.js', 'negotiate: { from:'),
              ('src/supplier/supplier-quote-api.js', 'withdraw: { from:'),
              ('src/supplier/supplier-quote-api.js', 'action === "expire"'),
              ('src/supplier/supplier-quote-api.js', "status='expired'"),
              ('src/supplier/supplier-workspace-api.js', 'WHERE r.supplier_id = ?'),
              ('src/supplier/supplier-workspace-api.js', 'WHERE supplier_id = ?'),
              ('migrations/0012_supplier_quote_messages.sql', 'commerce_supplier_quote_messages'),
              ('migrations/0012_supplier_quote_messages.sql', 'supplier_account_id'),
              ('src/supplier/supplier-messaging-api.js', 'MAX_MESSAGE_LENGTH = 4000'),
              ('src/supplier/supplier-messaging-api.js', 'sender_type: "supplier"'),
              ('src/supplier/supplier-messaging-api.js', 'commerce_supplier_quote_messages'),
              ('src/supplier/supplier-messaging-api.js', 'commerce_quote_messages'),
              ('src/customer/transaction-api.js', 'commerce_supplier_quote_messages'),
              ('src/customer/transaction-api.js', 'commerce_quote_messages'),
              ('src/customer/transaction-api.js', "'customer' AS sender_type"),
              ('src/customer/transaction-api.js', 'message_required'),
              ('src/customer/transaction-api.js', 'customer_account_id'),
          ]

          missing = []
          for filename, needle in checks:
              text = Path(filename).read_text(encoding='utf-8')
              if needle not in text:
                  missing.append(f'{filename}: {needle}')
          if missing:
              print('Missing contract assertions:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print(f'SITE-8 supplier and unified quote-thread contracts: PASS ({len(checks)} assertions)')
          PY
