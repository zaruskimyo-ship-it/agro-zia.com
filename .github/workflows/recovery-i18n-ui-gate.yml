name: Recovery I18N UI Gate

on:
  push:
    branches:
      - feat/recovery-4fe4c1d8-i18n-ui-qa
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  recovery-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check assets/zarus-language.js
          node --check assets/zarus-product.js
          node --check assets/zarus-supplier.js
          node --check assets/zarus-rfq.js
          node --check assets/floating-nav.js
          node --check assets/bottom-actions.js
      - name: Shared UI assets
        run: |
          test -s assets/floating-nav.css
          test -s assets/floating-nav.js
          test -s assets/bottom-actions.css
          test -s assets/bottom-actions.js
          grep -q 'z-index:1200' assets/floating-nav.css
          grep -q "Chat Online" assets/bottom-actions.js
          grep -q "Request Inquiry" assets/bottom-actions.js
          grep -q "گفتگوی آنلاین" assets/bottom-actions.js
          grep -q "درخواست استعلام" assets/bottom-actions.js
      - name: Public site integration
        run: |
          grep -q "assets/floating-nav.css" assets/site-foundation.js
          grep -q "assets/bottom-actions.css" assets/site-foundation.js
          grep -q "assets/floating-nav.js" assets/site-foundation.js
          grep -q "assets/bottom-actions.js" assets/site-foundation.js
          grep -q "assets/site-foundation.js" index.html
      - name: ZARUS integration
        run: |
          for page in zarus-product.html zarus-supplier.html zarus-rfq.html; do
            grep -q 'assets/floating-nav.css' "$page"
            grep -q 'assets/floating-nav.js' "$page"
            grep -q 'assets/bottom-actions.css' "$page"
            grep -q 'assets/bottom-actions.js' "$page"
            grep -q 'class="z-language"' "$page"
            grep -q 'assets/zarus-language.js' "$page"
          done
      - name: Language and RTL contract
        run: |
          grep -q "supported = new Set.*en.*fa.*ar.*uz.*tr.*ru" assets/zarus-language.js
          grep -q "rtl = new Set.*fa.*ar" assets/zarus-language.js
          grep -q "document.documentElement.lang = lang" assets/zarus-language.js
          grep -q "document.documentElement.dir" assets/zarus-language.js
          grep -q "searchParams.set('lang', next)" assets/zarus-language.js
