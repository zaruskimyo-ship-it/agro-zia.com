name: Inquiry Localization QA

on:
  push:
    branches:
      - qa/inquiry-localization-fix
  pull_request:
    branches:
      - qa/inquiry-localization-fix
      - release/inquiry-production-candidate

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run inquiry localization QA
        run: node qa/check-inquiry-localization.mjs
