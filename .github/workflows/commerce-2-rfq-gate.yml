name: Commerce-2 RFQ Gate

on:
  push:
    branches:
      - feat/commerce-2-rfq
  pull_request:
    branches:
      - main
    paths:
      - "src/commerce/**"
      - "migrations/0004_commerce_rfqs.sql"
      - "scripts/commerce-rfq-*.mjs"
      - "_worker.js"
      - ".github/workflows/commerce-2-rfq-gate.yml"

permissions:
  contents: read

jobs:
  rfq-contract-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: RFQ contract gate
        run: node scripts/commerce-rfq-contract-test.mjs

      - name: RFQ negative security gate
        run: node scripts/commerce-rfq-negative-test.mjs

      - name: RFQ mock-D1 runtime gate
        run: node scripts/commerce-rfq-runtime-test.mjs
