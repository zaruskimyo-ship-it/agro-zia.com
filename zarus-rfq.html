<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Submit a structured agricultural sourcing request to Zarus."><title>Zarus | Request for Quote</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7faf8;color:#17362a;line-height:1.6}.wrap{width:min(900px,92%);margin:auto}.top{padding:22px 0;border-bottom:1px solid #dce8e0;background:#fff}.top a{font-weight:900;text-decoration:none;color:#145b3b}.hero{padding:50px 0 25px}.hero h1{font-size:42px;line-height:1.1}.muted{color:#60766b}.card{background:#fff;border:1px solid #dce8e0;border-radius:16px;padding:25px;margin-bottom:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-weight:800;font-size:12px}input,select,textarea{width:100%;margin-top:6px;padding:11px;border:1px solid #cbdacf;border-radius:8px;font:inherit}textarea{min-height:120px}.full{grid-column:1/-1}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.btn{border:0;background:#145b3b;color:#fff;padding:13px 20px;border-radius:9px;font-weight:900;cursor:pointer}.result{margin-top:16px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:35px}}</style></head><body><header class="top"><div class="wrap"><a href="/zarus-marketplace.html">← ZARUS MARKETPLACE</a></div></header><main class="wrap"><section class="hero"><p class="muted">B2B SOURCING</p><h1>Request a quotation</h1><p class="muted">Describe the exact supply requirement so the commercial workflow can match it to the right supplier.</p></section><form class="card" id="rfq"><div class="grid"><label>Product / commodity<input required name="product_name" maxlength="200"></label><label>Quantity<input name="quantity" maxlength="120" placeholder="e.g. 500 MT"></label><label>Destination country<input name="destination_country" maxlength="120"></label><label>Destination location<input name="destination_location" maxlength="200"></label><label>Packaging<input name="packaging" maxlength="500"></label><label>Target timing<input name="target_timing" maxlength="200"></label><label>Private label<input name="private_label" maxlength="120" placeholder="Optional"></label><label>Documents required<input name="documents_required" maxlength="1000" placeholder="Optional"></label><label class="full">Detailed specification<textarea name="description" maxlength="5000" placeholder="Grade, analysis, quality, origin, certifications and other requirements"></textarea></label><label>Company<input name="buyer_company" maxlength="200"></label><label>Contact name<input name="buyer_name" maxlength="160"></label><label>Email<input type="email" name="buyer_email" maxlength="254"></label><label>Phone<input name="buyer_phone" maxlength="80"></label><label class="check full"><input type="checkbox" name="sample_required"> Sample required</label></div><input type="hidden" name="language" value="en"><input type="hidden" name="attachment_count" value="0"><p><button class="btn" type="submit">Submit RFQ</button></p><div class="result" id="result" aria-live="polite"></div></form></main><script>const form=document.getElementById('rfq'),result=document.getElementById('result');form.addEventListener('submit',async e=>{e.preventDefault();result.textContent='Submitting…';const data=Object.fromEntries(new FormData(form).entries());data.sample_required=form.sample_required.checked;data.attachment_count=0;try{const r=await fetch('/api/rfqs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw new Error(d.error||'rfq_failed');result.textContent=`RFQ submitted successfully${d.rfq?.request_number?` — ${d.rfq.request_number}`:''}.`;form.reset();}catch(err){result.textContent='The RFQ could not be submitted right now. Please use the business inquiry form instead.';}});</script></body></html>
