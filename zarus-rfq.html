<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Submit a structured agricultural sourcing request to ZARUS."><link rel="stylesheet" href="/assets/zarus-marketplace.css"><link rel="stylesheet" href="/assets/bottom-actions.css"><title>ZARUS | Request for Quote</title></head><body><header class="z-header"><div class="z-nav"><a class="z-brand" href="/zarus.html">ZARUS</a><nav><a href="/zarus.html">Home</a><a href="/products.html">Catalog</a><a href="/suppliers.html">Suppliers</a><a class="active" href="/zarus-rfq.html">Request for Quote</a><a href="/zarus-workspace.html">My Workspace</a></nav></div></header><main><section class="z-page-hero"><div class="z-wrap"><p class="z-kicker">B2B SOURCING</p><h1>Request a quotation</h1><p>Describe the exact supply requirement so the commercial workflow can match it to the selected product and supplier.</p></div></section><section class="z-section"><div class="z-wrap"><form class="z-panel" id="rfq"><div id="rfq-context" class="z-context"></div><div class="z-form-grid"><input type="hidden" name="product_id"><input type="hidden" name="supplier_id"><input type="hidden" name="language"><label>Product / commodity<input required name="product_name" maxlength="200"></label><label>Quantity<input name="quantity" maxlength="120" placeholder="e.g. 500 MT"></label><label>Destination country<input name="destination_country" maxlength="120"></label><label>Destination location<input name="destination_location" maxlength="200"></label><label>Packaging<input name="packaging" maxlength="500"></label><label>Target timing<input name="target_timing" maxlength="200"></label><label>Private label<input name="private_label" maxlength="120"></label><label>Documents required<input name="documents_required" maxlength="1000"></label><label class="full">Detailed specification<textarea name="description" maxlength="5000" required placeholder="Grade, analysis, quality, origin, certifications and other requirements"></textarea></label><label>Company<input name="buyer_company" maxlength="200"></label><label>Contact name<input name="buyer_name" maxlength="160"></label><label>Email<input type="email" name="buyer_email" maxlength="254"></label><label>Phone<input name="buyer_phone" maxlength="80"></label><label class="z-check full"><input type="checkbox" name="sample_required"> Sample required</label></div><input type="hidden" name="attachment_count" value="0"><button class="z-btn" type="submit">Submit RFQ</button><div class="z-result" id="result" aria-live="polite"></div></form></div></section></main><script src="/assets/zarus-rfq.js" defer></script><script src="/assets/bottom-actions.js" defer></script></body></html>
