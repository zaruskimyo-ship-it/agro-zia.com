<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Submit a structured agricultural sourcing request to ZARUS."><link rel="stylesheet" href="/assets/zarus-marketplace.css"><link rel="stylesheet" href="/assets/floating-nav.css"><link rel="stylesheet" href="/assets/bottom-actions.css"><title>ZARUS | Request for Quote</title></head><body><header class="z-header"><div class="z-nav"><a class="z-brand" href="/zarus.html?lang=en">ZARUS</a><a class="z-home" href="/zarus.html?lang=en">Home</a><button class="z-menu" type="button" aria-expanded="false">Menu</button><nav class="z-links"><a href="/zarus.html?lang=en">ZARUS</a><a href="/products.html?lang=en">Catalog</a><a href="/suppliers.html?lang=en">Suppliers</a><a class="active" href="/zarus-rfq.html?lang=en">Request for Quote</a><a href="/zarus-workspace.html?lang=en">My Workspace</a></nav><select class="z-language" aria-label="Select language"><option value="en">English</option><option value="fa">فارسی</option><option value="ar">العربية</option><option value="uz">O‘zbek</option><option value="tr">Türkçe</option><option value="ru">Русский</option></select></div></header><main><section class="z-page-hero"><div class="z-wrap"><p class="z-kicker" data-i18n="kicker">B2B SOURCING</p><h1 data-i18n="title">Request a quotation</h1><p data-i18n="intro">Describe the exact supply requirement so the commercial workflow can match it to the selected product and supplier.</p></div></section><section class="z-section"><div class="z-wrap"><form class="z-panel" id="rfq"><div id="rfq-context" class="z-context"></div><div class="z-form-grid"><input type="hidden" name="product_id"><input type="hidden" name="supplier_id"><input type="hidden" name="language"><label data-i18n="product"><span>Product / commodity</span><input required name="product_name" maxlength="200"></label><label data-i18n="quantity"><span>Quantity</span><input name="quantity" maxlength="120" placeholder="e.g. 500 MT"></label><label data-i18n="country"><span>Destination country</span><input name="destination_country" maxlength="120"></label><label data-i18n="location"><span>Destination location</span><input name="destination_location" maxlength="200"></label><label data-i18n="packaging"><span>Packaging</span><input name="packaging" maxlength="500"></label><label data-i18n="timing"><span>Target timing</span><input name="target_timing" maxlength="200"></label><label data-i18n="privateLabel"><span>Private label</span><input name="private_label" maxlength="120"></label><label data-i18n="documents"><span>Documents required</span><input name="documents_required" maxlength="1000"></label><label class="full" data-i18n="specification"><span>Detailed specification</span><textarea name="description" maxlength="5000" required placeholder="Grade, analysis, quality, origin, certifications and other requirements"></textarea></label><label data-i18n="company"><span>Company</span><input name="buyer_company" maxlength="200"></label><label data-i18n="contact"><span>Contact name</span><input name="buyer_name" maxlength="160"></label><label data-i18n="email"><span>Email</span><input type="email" name="buyer_email" maxlength="254"></label><label data-i18n="phone"><span>Phone</span><input name="buyer_phone" maxlength="80"></label><label class="z-check full"><input type="checkbox" name="sample_required"><span data-i18n="sample">Sample required</span></label></div><input type="hidden" name="attachment_count" value="0"><button class="z-btn" type="submit" data-i18n="submit">Submit RFQ</button><div class="z-result" id="result" aria-live="polite"></div></form></div></section></main><script src="/assets/zarus-language.js" defer></script><script src="/assets/zarus-rfq.js" defer></script><script src="/assets/floating-nav.js" defer></script><script src="/assets/bottom-actions.js" defer></script></body></html>
