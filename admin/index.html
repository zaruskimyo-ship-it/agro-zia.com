<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agro-Zia | Inquiry Dashboard</title>
<style>
:root{--ink:#17362a;--muted:#60766b;--green:#145b3b;--soft:#edf5ef;--line:#dce8e0;--dark:#0c291d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7faf8;color:var(--ink)}header{background:var(--dark);color:#fff;padding:22px 0}.wrap{width:min(1180px,94%);margin:auto}.brand{font-weight:900;letter-spacing:1.5px}.sub{font-size:12px;color:#b8c9bf;margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:22px 0}.toolbar{display:grid;grid-template-columns:1.4fr .8fr auto;gap:10px;align-items:end}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}input,select,button{font:inherit;border:1px solid #cbdcd2;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink)}button{background:var(--green);color:#fff;border:0;font-weight:800;cursor:pointer}.meta{font-size:13px;color:var(--muted);margin:10px 0}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.ref{font-weight:900;color:var(--green);white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:800}.error{padding:16px;border:1px solid #efc7c2;background:#fff1f0;border-radius:12px;color:#7b241c;display:none}.empty{padding:35px;text-align:center;color:var(--muted)}#login{max-width:520px;margin:55px auto}#dashboard{display:none}@media(max-width:760px){.toolbar{grid-template-columns:1fr}.wrap{width:92%}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">AGRO-ZIA — INQUIRY DASHBOARD</div><div class="sub">Private B2B request management · read-only first release</div></div></header>
<main class="wrap">
<section class="card" id="login">
<h2>Admin access</h2>
<p class="meta">Enter the private dashboard token configured for this Worker.</p>
<form id="loginForm"><label for="token">Admin token</label><input id="token" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form>
<div class="error" id="loginError"></div>
</section>
<section id="dashboard">
<form class="card toolbar" id="filters">
<div><label for="q">Search</label><input id="q" placeholder="Reference, company, product, destination..."></div>
<div><label for="status">Status</label><select id="status"><option value="">All statuses</option><option>received</option><option>reviewing</option><option>quoted</option><option>negotiating</option><option>confirmed</option><option>closed</option></select></div>
<button type="submit">Refresh</button>
</form>
<div class="meta" id="meta">Loading inquiries…</div>
<div class="error" id="error"></div>
<div class="table-wrap" id="tableWrap"><div class="empty">Loading…</div></div>
</section>
</main>
<script>
const tokenInput=document.getElementById('token'),login=document.getElementById('login'),dashboard=document.getElementById('dashboard'),loginForm=document.getElementById('loginForm'),loginError=document.getElementById('loginError'),q=document.getElementById('q'),status=document.getElementById('status'),meta=document.getElementById('meta'),error=document.getElementById('error'),tableWrap=document.getElementById('tableWrap');
let token=sessionStorage.getItem('agrozia_admin_token')||'';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function params(){const p=new URLSearchParams();if(q.value.trim())p.set('q',q.value.trim());if(status.value)p.set('status',status.value);return p}
async function load(){error.style.display='none';tableWrap.innerHTML='<div class="empty">Loading…</div>';try{const r=await fetch('/api/admin/inquiries?'+params().toString(),{cache:'no-store',headers:{Authorization:'Bearer '+token}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');const rows=data.inquiries||[];meta.textContent=`${rows.length} inquiry${rows.length===1?'':'ies'} shown · newest first`;if(!rows.length){tableWrap.innerHTML='<div class="empty">No inquiries found.</div>';return}tableWrap.innerHTML='<table><thead><tr><th>Reference</th><th>Date</th><th>Company</th><th>Product</th><th>Specification</th><th>Destination</th><th>Contact</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>`<tr><td class="ref">${esc(x.request_number)}</td><td>${esc(new Date(x.created_at).toLocaleString())}</td><td>${esc(x.company)}</td><td>${esc(x.product)}</td><td>${esc(x.specification)}</td><td>${esc(x.destination)}</td><td>${esc(x.email)}<br>${esc(x.phone)}</td><td><span class="badge">${esc(x.status)}</span></td></tr>`).join('')+'</tbody></table>'}catch(e){meta.textContent='Unable to load inquiries';if(e.message==='admin_auth_required'){sessionStorage.removeItem('agrozia_admin_token');token='';dashboard.style.display='none';login.style.display='block';loginError.textContent='Invalid or missing admin token.';loginError.style.display='block';return}error.textContent=e.message;error.style.display='block';tableWrap.innerHTML=''}}
loginForm.addEventListener('submit',e=>{e.preventDefault();token=tokenInput.value.trim();if(!token)return;sessionStorage.setItem('agrozia_admin_token',token);login.style.display='none';dashboard.style.display='block';load()});
document.getElementById('filters').addEventListener('submit',e=>{e.preventDefault();load()});
if(token){login.style.display='none';dashboard.style.display='block';load()}
</script>
</body>
</html>
