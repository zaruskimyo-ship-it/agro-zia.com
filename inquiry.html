t.show{display:block}.result.error{background:#fff1f0;border-color:#efc7c2}.ref{font-size:1.3rem;letter-spacing:.6px}.date{font-size:1rem;font-weight:700}.zarus{margin-top:28px;background:var(--dark);color:#fff;border-radius:18px;padding:26px}.zarus p{color:#b8c9bf}footer{margin-top:50px;background:var(--dark);color:#fff;padding:36px 0}.footer-desc{color:#b8c9bf}html[dir=rtl] body{text-align:right}html[dir=rtl] .links,html[dir=rtl] .actions{direction:rtl}@media(max-width:760px){.links{display:none}.grid2{grid-template-columns:1fr}.hero{padding:50px 0}}

ar:{products:'المنتجات',detail:'تفاصيل المنتج',contact:'اتصل بنا',eyebrow:'استفسار تجاري B2B',title:'أخبر Agro-Zia بما تحتاجه.',lead:'أرسل طلبك. ينشئ خادم Agro-Zia رقم المرجع أولاً؛ البريد الإلكتروني خطوة اختيارية فقط.',product:'المنتج / الفئة *',company:'الشركة',spec:'المواصفات المطلوبة',quantity:'الكمية',destination:'الوجهة',timing:'التوقيت المفضل',email:'البريد الإلكتروني',phone:'الهاتف / واتساب',message:'متطلبات إضافية',submit:'إرسال الاستفسار',whatsapp:'المتابعة عبر واتساب',note:'يتم إنشاء رقم المرجع على الخادم ولا تحتاج هذه الخطوة إلى D1.',sending:'جارٍ تسجيل الاستفسار...',success:'تم إرسال الاستفسار بنجاح',reference:'رقم المرجع',date:'تاريخ ووقت الطلب',received:'تم استلام استفسارك. يرجى الاحتفاظ بهذا الرقم.',email_btn:'فتح مسودة البريد',copy:'نسخ الرقم',error:'تعذر إرسال الاستفسار: '},
uz:{products:'Mahsulotlar',detail:'Mahsulot tafsiloti',contact:'Aloqa',eyebrow:'B2B BIZNES SO‘ROVI',title:'Agro-Zia ga ehtiyojingizni yuboring.',lead:'Talabingizni yuboring. Agro-Zia serveri avval so‘rov raqamini yaratadi; email faqat ixtiyoriy qadam.',product:'Mahsulot / kategoriya *',company:'Kompaniya',spec:'Kerakli spetsifikatsiya',quantity:'Miqdor',destination:'Manzil',timing:'Istalgan muddat',email:'Email',phone:'Telefon / WhatsApp',message:'Qo‘shimcha talablar',submit:'So‘rovni yuborish',whatsapp:'WhatsApp orqali davom etish',note:'So‘rov raqami serverda yaratiladi. Bu bosqich uchun D1 talab qilinmaydi.',sending:'So‘rov yuborilmoqda...',success:'So‘rov muvaffaqiyatli yuborildi',reference:'So‘rov raqami',date:'So‘rov sanasi va vaqti',received:'So‘rovingiz qabul qilindi. Ushbu raqamni saqlang.',email_btn:'Email qoralamasini ochish',copy:'Raqamni nusxalash',error:'So‘rov yuborilmadi: '},
tr:{products:'Ürünler',detail:'Ürün Detayı',contact:'İletişim',eyebrow:'B2B İŞ TALEBİ',title:'Agro-Zia’ya ihtiyacınızı bildirin.',lead:'Talebinizi gönderin. Agro-Zia sunucusu önce referans numarası oluşturur; e-posta yalnızca isteğe bağlı bir adımdır.',product:'Ürün / kategori *',company:'Şirket',spec:'Gerekli teknik özellik',quantity:'Miktar',destination:'Varış yeri',timing:'Tercih edilen zaman',email:'E-posta',phone:'Telefon / WhatsApp',message:'Ek gereksinimler',submit:'Talebi Gönder',whatsapp:'WhatsApp ile devam et',note:'Talep referansı sunucuda oluşturulur. Bu adım için D1 gerekmez.',sending:'Talep gönderiliyor...',success:'Talep başarıyla gönderildi',reference:'Talep Referansı',date:'Talep Tarihi ve Saati',received:'Talebiniz alındı. Bu numarayı saklayın.',email_btn:'E-posta Taslağını Aç',copy:'Referansı Kopyala',error:'Talep gönderilemedi: '}
};
const langs=Object.keys(T);const lang=()=>{const x=new URLSearchParams(location.search).get('lang');return langs.includes(x)?x:'en'};
function render(){const l=lang();document.documentElement.lang=l;document.documentElement.dir=['fa','ar'].includes(l)?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{const k=e.dataset.t;if(T[l][k])e.textContent=T[l][k]});document.querySelectorAll('[data-lang-link]').forEach(a=>a.href=`inquiry.html?lang=${a.dataset.langLink}`)}
const form=document.getElementById('rfq'),result=document.getElementById('result'),button=document.getElementById('submit-btn');let busy=false;render();
const value=id=>document.getElementById(id).value.trim();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatCreatedAt(value,l){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return esc(value);const locale={fa:'fa-IR',ar:'ar',ru:'ru-RU',uz:'uz-UZ',tr:'tr-TR',en:'en-US'}[l]||'en-US';return new Intl.DateTimeFormat(locale,{dateStyle:'medium',timeStyle:'short',hour12:false}).format(d)}
form.addEventListener('submit',async e=>{e.preventDefault();e.stopImmediatePropagation();if(busy)return;const l=lang(),t=T[l];const data={language:l,product:value('product'),company:value('company'),specification:value('spec'),quantity:value('quantity'),destination:value('destination'),timing:value('timing'),email:value('email'),phone:value('phone'),message:value('message')};if(!data.product){result.className='result error show';result.textContent=t.error+'product_required';return}if(!data.email&&!data.phone){result.className='result error show';result.textContent=t.error+'contact_required';return}busy=true;button.disabled=true;result.className='result show';result.textContent=t.sending;try{const r=await fetch('/api/inquiries',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},cache:'no-store',body:JSON.stringify(data)});const j=await r.json();if(!r.ok||j.ok!==true||!j.request_number)throw new Error(j.error||'request_failed');const ref=j.request_number;const createdAt=formatCreatedAt(j.created_at,l);const emailDate=formatCreatedAt(j.created_at,'en');const subject=`Agro-Zia B2B Inquiry — ${data.product}`;const body=[`Request Reference: ${ref}`,`Request Date & Time: ${emailDate||''}`,`Product / category: ${data.product}`,`Company: ${data.company}`,`Specification: ${data.specification}`,`Quantity: ${data.quantity}`,`Destination: ${data.destination}`,`Preferred timing: ${data.timing}`,`Email: ${data.email}`,`Phone / WhatsApp: ${data.phone}`,`Additional requirements: ${data.message}`].join('\n');const mailto=`mailto:export@agro-zia.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;result.className='result show';result.innerHTML=`<strong>${esc(t.success)}</strong><p>${esc(t.reference)}: <span class="ref"><strong>${esc(ref)}</strong></span></p>${createdAt?`<p>${esc(t.date)}: <span class="date">${createdAt}</span></p>`:''}<p>${esc(t.received)}</p><div class="actions"><button type="button" class="btn alt" id="copy-ref">${esc(t.copy)}</button><a class="btn" href="${mailto}">${esc(t.email_btn)}</a></div>`;document.getElementById('copy-ref').onclick=async()=>{try{await navigator.clipboard.writeText(ref);document.getElementById('copy-ref').textContent='✓ '+t.copy}catch(_){}};form.querySelectorAll('input,textarea').forEach(x=>x.disabled=true);button.style.display='none';result.scrollIntoView({behavior:'smooth',block:'center'})}catch(err){result.className='result error show';result.textContent=t.error+(err.message||'request_failed');busy=false;button.disabled=false}});
