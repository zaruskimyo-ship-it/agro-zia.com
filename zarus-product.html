<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="ZARUS agricultural product detail and business inquiry."><title>ZARUS | Product</title><link rel="stylesheet" href="assets/zarus-marketplace.css"><style>.detail{padding:70px 0}.detail-grid{display:grid;grid-template-columns:1fr .8fr;gap:24px}.detail-card{background:#fff;border:1px solid var(--z-line);border-radius:20px;padding:30px}.detail-card h1{font-size:clamp(38px,5vw,58px);line-height:1.05;margin:8px 0 18px}.fact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:25px 0}.fact-box{border:1px solid var(--z-line);border-radius:12px;padding:13px}.fact-box small{display:block;color:var(--z-muted)}.fact-box strong{display:block;margin-top:4px}.notice{background:#edf5ef;border-radius:14px;padding:18px;color:var(--z-ink)}@media(max-width:800px){.detail-grid{grid-template-columns:1fr}.fact-grid{grid-template-columns:1fr}}</style></head><body><header class="z-header"><div class="z-wrap z-nav"><a class="z-logo" href="zarus.html"><span>Z</span>ARUS</a><nav class="z-links"><a href="zarus.html#catalog" data-z="catalog"></a><a href="suppliers.html?lang=en" data-z="suppliers"></a><a href="inquiry.html?lang=en" data-z="rfq"></a></nav><div class="z-actions"><a class="z-btn" href="inquiry.html?lang=en" data-z="request"></a></div></div></header><main class="detail"><div class="z-wrap" id="product-root"><div class="z-empty">Loading product…</div></div></main><footer class="z-footer"><div class="z-wrap"><strong>ZARUS</strong><p>Agricultural B2B marketplace · Powered by AGRO-ZIA.</p></div></footer><script>const q=new URLSearchParams(location.search);const id=q.get('id');const lang=q.get('lang')||'en';document.documentElement.lang=lang;document.documentElement.dir=['fa','ar'].includes(lang)?'rtl':'ltr';const root=document.querySelector('#product-root');const esc=v=>{const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML};async function run(){if(!id){root.innerHTML='<div class="z-empty">Product not specified.</div>';return}try{const r=await fetch('/api/products/'+encodeURIComponent(id),{headers:{accept:'application/json'}});if(!r.ok)throw 0;const d=await r.json();const p=d.product||d.data||d;const name=p.name||p.product_name||p.title||'Agricultural Product';const desc=p.description||p.specification||p.summary||'Professional agricultural supply item.';root.innerHTML=`<div class="detail-grid"><section class="detail-card"><div class="z-kicker">${esc(p.category||'AGRICULTURAL PRODUCT')}</div><h1>${esc(name)}</h1><p class="z-muted">${esc(desc)}</p><div class="fact-grid">${p.unit?`<div class="fact-box"><small>Unit</small><strong>${esc(p.unit)}</strong></div>`:''}${p.moq?`<div class="fact-box"><small>MOQ</small><strong>${esc(p.moq)}</strong></div>`:''}${p.lead_time?`<div class="fact-box"><small>Lead time</small><strong>${esc(p.lead_time)}</strong></div>`:''}<div class="fact-box"><small>Commercial</small><strong>Quotation by inquiry</strong></div></div><div class="notice">Commercial terms, availability and supplier assignment are confirmed case by case.</div></section><aside class="detail-card"><div class="z-kicker">B2B ACTION</div><h2>Need this product?</h2><p class="z-muted">Send quantity, destination and required specification to start the commercial process.</p><a class="z-btn" href="inquiry.html?lang=${encodeURIComponent(lang)}&product=${encodeURIComponent(name)}">Request a Quote</a><p style="margin-top:18px"><a href="zarus.html?lang=${encodeURIComponent(lang)}">← Back to catalog</a></p></aside></div>`;document.title='ZARUS | '+name}catch(e){root.innerHTML='<div class="z-empty">This product is not available as a published catalog item.</div>'}}run();</script></body></html>
